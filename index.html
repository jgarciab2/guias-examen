<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guías de examen · Primaria</title>
<style>
  :root{
    --bg:#eef4ff; --card:#ffffff; --ink:#15324a; --muted:#5b6b8c;
    --primary:#ff5fa2; --accent:#1aa6b7; --accent-d:#128695;
    --line:#dce6f4; --shadow:0 8px 24px rgba(21,50,74,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1b22; --card:#16242d; --ink:#eaf6f2; --muted:#9fb6c6;
      --line:#26404b; --shadow:0 8px 24px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:16px;min-height:100vh;
    display:flex;flex-direction:column;justify-content:center}
  header.top{text-align:center;padding:10px 0}
  header.top h1{margin:.1em 0;font-size:clamp(1.7rem,6vw,2.4rem);color:var(--primary);line-height:1.1}
  header.top .sub{color:var(--accent);font-weight:800}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:22px;margin:16px 0}
  .lbl{font-weight:800;margin:4px 0 8px;color:var(--ink)}
  .grades{display:flex;gap:10px;flex-wrap:wrap}
  .grado{flex:1 1 90px;background:var(--card);color:var(--ink);border:2px solid var(--line);
    border-radius:16px;padding:16px 0;font-size:1.25rem;font-weight:800;cursor:pointer;
    transition:transform .05s ease}
  .grado:active{transform:scale(.97)}
  .grado.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  select{font:inherit;width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;
    background:var(--card);color:var(--ink);font-weight:700;font-size:1.05rem;margin-top:14px}
  button.open{font:inherit;cursor:pointer;border:none;border-radius:16px;width:100%;margin-top:14px;
    padding:16px;font-weight:800;font-size:1.1rem;background:var(--primary);color:#fff;transition:filter .15s}
  button.open:hover{filter:brightness(1.05)}
  button.open:disabled{opacity:.45;cursor:default}
  .materias{display:grid;gap:10px;margin-top:14px}
  .mat{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);
    border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:700;background:var(--card)}
  .mat:hover{border-color:var(--accent)}
  .mat .em{font-size:1.6rem}
  .mat .go{margin-left:auto;color:var(--accent);font-weight:800}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:16px 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Guías de examen</h1>
    <div class="sub">Primaria · 1er Trimestre</div>
  </header>

  <div class="card">
    <div class="lbl">1) Elige el grado:</div>
    <div class="grades" id="grades">
      <button class="grado" data-g="2" onclick="pickGrade('2')">2º</button>
      <button class="grado" data-g="3" onclick="pickGrade('3')">3º</button>
      <button class="grado" data-g="4" onclick="pickGrade('4')">4º</button>
      <button class="grado active" data-g="5" onclick="pickGrade('5')">5º</button>
    </div>

    <div class="lbl" style="margin-top:18px">2) Elige la materia:</div>
    <select id="sel" onchange="syncBtn()" aria-label="Materia"></select>
    <button class="open" id="btn" onclick="abrir()">Abrir examen y guía ▶</button>

    <div class="materias" id="cards"></div>
  </div>

  <footer>Toca una materia para abrir su examen interactivo y su guía de estudio.</footer>
</div>

<script>
"use strict";
const MATERIAS = {
  "2":[
    {n:"Saberes y Pensamiento Científico", f:"saberes.html?g=2", em:"🔬"},
    {n:"Lenguajes", em:"📚", soon:true},
  ],
  "3":[{n:"Lenguajes", f:"lenguajes.html?g=3", em:"📚"}],
  "4":[
    {n:"Lenguajes", f:"lenguajes.html?g=4", em:"📚"},
    {n:"Saberes y Pensamiento Científico", f:"saberes.html?g=4", em:"🔬"},
  ],
  "5":[
    {n:"Lenguajes", f:"lenguajes.html?g=5", em:"📚"},
    {n:"Saberes y Pensamiento Científico", f:"saberes.html?g=5", em:"🔬"},
    {n:"Ética, Naturaleza y Sociedades", f:"examen.html?m=etica", em:"🌎"},
    {n:"De lo Humano y lo Comunitario", f:"examen.html?m=humano", em:"🤝"},
  ],
};
let grado = "5";

function pickGrade(g){
  grado = g;
  document.querySelectorAll(".grado").forEach(b=>b.classList.toggle("active", b.dataset.g===g));
  const list = MATERIAS[g];
  // dropdown (lo que pidió el usuario: seleccionable con las materias)
  document.getElementById("sel").innerHTML =
    `<option value="" disabled selected>— Elige una materia —</option>` +
    list.map((m,i)=> m.soon
      ? `<option value="" disabled>${m.em} ${m.n} — Próximamente</option>`
      : `<option value="${i}">${m.em} ${m.n}</option>`).join("");
  // tarjetas rápidas (mismo listado, un toque directo)
  document.getElementById("cards").innerHTML = list.map(m=>
    m.soon
      ? `<div class="mat" style="opacity:.55;cursor:default"><span class="em">${m.em}</span><span>${m.n}</span><span class="go" style="color:var(--muted)">Próximamente</span></div>`
      : `<a class="mat" href="${m.f}"><span class="em">${m.em}</span><span>${m.n}</span><span class="go">Abrir ▶</span></a>`).join("");
  syncBtn();
}
function syncBtn(){
  const v = document.getElementById("sel").value;
  document.getElementById("btn").disabled = (v==="");
}
function abrir(){
  const v = document.getElementById("sel").value;
  if(v==="") return;
  location.href = MATERIAS[grado][+v].f;
}
pickGrade("5");

// self-check: cada materia tiene archivo destino
Object.values(MATERIAS).flat().forEach(m=>console.assert(typeof m.f==="string"&&m.f.includes(".html"),"materia sin archivo: "+m.n));
</script>
</body>
</html>
